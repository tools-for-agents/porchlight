<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="hangar">
  <title>hangar</title>
  <!--
    Black and green: a lit hangar door, nine bays, one running.

    Apple's grid — an 824 squircle inset 100 in a 1024 canvas — so it sits in the Dock
    like everything else rather than filling its own square.

    The colour does the talking: the body is near-black with a green rim, the door is
    drawn in phosphor green, and the one live bay is the only fully-lit thing in the
    picture. That is the product — eight bays waiting, one working — and it is also the
    app's own palette, so the icon and the window mean the same thing by the same rule.

    It has to survive 32px in the Dock and 20px in the title bar, so: one silhouette, one
    accent, no hairlines. The door is a thick stroke, the bays are solid, and the live one
    glows. At 32px you still read a door with a green light in it.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1512"/>
      <stop offset="1" stop-color="#040605"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".85"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity=".35"/>
    </linearGradient>
    <!-- A glow that bleeds over its neighbours stops being "one bay is lit" and becomes
         a smudge — especially small, where the 20px gaps are already sub-pixel. Tight. -->
    <filter id="lit" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="112" y="112" width="800" height="800" rx="173" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <!-- the door -->
  <path d="M300 740 V486 a212 212 0 0 1 424 0 V740"
        fill="none" stroke="#22c55e" stroke-width="26" stroke-linecap="round"/>
  <!-- the floor it stands on -->
  <rect x="276" y="742" width="472" height="20" rx="10" fill="#4ade80"/>

  <!-- eight waiting -->
  <g fill="#22c55e" opacity=".5">
    <rect x="372" y="446" width="80" height="80" rx="24"/>
    <rect x="472" y="446" width="80" height="80" rx="24"/>
    <rect x="572" y="446" width="80" height="80" rx="24"/>
    <rect x="372" y="546" width="80" height="80" rx="24"/>
    <rect x="572" y="546" width="80" height="80" rx="24"/>
    <rect x="372" y="646" width="80" height="80" rx="24"/>
    <rect x="472" y="646" width="80" height="80" rx="24"/>
    <rect x="572" y="646" width="80" height="80" rx="24"/>
  </g>

  <!-- one running -->
  <g filter="url(#lit)">
    <rect x="472" y="546" width="80" height="80" rx="24" fill="#4ade80"/>
  </g>
</svg>
